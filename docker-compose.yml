services:

  # ── PostgreSQL unique ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Series Service (API TVMaze) ────────────────────────────
  series-service:
    build: ./series-service
    container_name: series-service
    ports:
      - "8000:8000"
    volumes:
      - ./series-service:/app
    restart: always
    networks:
      - app-network

  # ── User Service ───────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8002:8000"
    volumes:
      - ./user-service:/app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: userdb
      POSTGRES_HOST: postgres
      SECRET_KEY: dev_secret_key_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  # ── Frontend + Nginx Proxy ─────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - series-service
    restart: always
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge