apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: serie-virtualservice
spec:
  hosts:
  - "*"
  gateways:
  - series-gateway
  http:
    # RÈGLE 1 : Backend Series
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: series-service
            port:
              number: 8000

    # RÈGLE 2 : Backend Users
    - match:
        - uri:
            prefix: /users
      route:
        - destination:
            host: user-service
            port:
              number: 8000

    # RÈGLE 3 : Frontend (Par défaut)
    - route:
        - destination:
            host: frontend-service
            port:
              number: 80