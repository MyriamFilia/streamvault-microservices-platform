apiVersion: apps/v1
kind: Deployment
metadata:
  name: favorites-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: favorites-service
  template:
    metadata:
      labels:
        app: favorites-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "50051"
    spec:
      containers:
        - name: favorites-service
          image: myrafilia/favorites-service:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_DB
              value: favoritesdb
            - name: SECRET_KEY
              value: dev_secret_key_change_in_production
            - name: SERIES_SERVICE_ADDR
              value: series-service:50051
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /favorites/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10