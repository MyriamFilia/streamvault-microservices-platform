apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
      annotations:
        traffic.sidecar.istio.io/excludeOutboundPorts: "50051"
    spec:
      serviceAccountName: review-service-sa
      containers:
        - name: review-service
          image: myrafilia/review-service:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "reviewdb"
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: SECRET_KEY
              value: "dev_secret_key_change_in_production"
            - name: SERIES_SERVICE_ADDR
              value: "series-service:50051"
          livenessProbe:
            httpGet:
              path: /reviews/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10