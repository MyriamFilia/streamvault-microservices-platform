apiVersion: apps/v1
kind: Deployment
metadata:
  name: series-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: series-service
  template:
    metadata:
      labels:
        app: series-service
    spec:
      containers:
        - name: series-service
          image: myrafilia/series-service:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000